[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pulso-clinical"
version = "0.1.0"
description = "Local clinical operations copilot for emergency care"
requires-python = ">=3.11"

[project.scripts]
pulso = "pulso.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  ".agents",
  "node_modules",
  "docs/research",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
